<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Alumni Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #0F172A;
      --bg-mid: #1E293B;
      --card: rgba(255, 255, 255, 0.96);
      --text: #0F172A;
      --muted: #64748B;
      --border: #CBD5E1;
      --blue: #3B82F6;
      --blue-hover: #2563EB;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --focus-ring: rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      overflow-x: hidden;
    }

    .page-shell {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      isolation: isolate;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.34), rgba(99, 102, 241, 0.06) 62%, transparent 72%);
      filter: blur(4px);
      opacity: 0.7;
      z-index: -1;
      animation: floatOrb 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb-one {
      width: 280px;
      height: 280px;
      top: 8%;
      left: 10%;
    }

    .orb-two {
      width: 220px;
      height: 220px;
      right: 12%;
      bottom: 10%;
      animation-duration: 18s;
      animation-delay: -5s;
    }

    .orb-three {
      width: 160px;
      height: 160px;
      right: 24%;
      top: 18%;
      animation-duration: 20s;
      animation-delay: -9s;
      opacity: 0.55;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 48px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      animation: cardIn 400ms ease-out both;
    }

    .brand {
      display: grid;
      justify-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-align: center;
    }

    .logo-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--blue);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 14px 30px rgba(59, 130, 246, 0.35);
    }

    .system-name {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    h1,
    p {
      margin: 0;
    }

    .heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .heading h1 {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
    }

    .heading p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      color: #334155;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #FFFFFF;
      color: var(--text);
      font: inherit;
      padding: 0 14px;
      outline: none;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 200ms ease, color 200ms ease;
    }

    .toggle-password:hover {
      background: #EFF6FF;
      color: var(--blue-hover);
    }

    .submit-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #FFFFFF;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 200ms ease, transform 200ms ease, opacity 200ms ease;
    }

    .submit-btn:hover {
      background: var(--blue-hover);
      transform: scale(1.01);
    }

    .submit-btn:disabled {
      cursor: not-allowed;
      opacity: 0.78;
      transform: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      display: none;
      animation: spin 800ms linear infinite;
    }

    .submit-btn.is-loading .spinner {
      display: block;
    }

    .error-message {
      display: none;
      padding: 12px 14px;
      border: 1px solid var(--danger-border);
      border-radius: 12px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .error-message.is-visible {
      display: block;
    }

    .bottom-text {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatOrb {
      from {
        transform: translate3d(-18px, 12px, 0) scale(1);
      }
      to {
        transform: translate3d(22px, -24px, 0) scale(1.08);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {
      .page-shell {
        padding: 24px 16px;
      }

      .auth-card {
        max-width: 420px;
        padding: 34px 24px;
      }

      .orb-one {
        left: -90px;
      }

      .orb-two {
        right: -70px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>
    <div class="orb orb-three" aria-hidden="true"></div>

    <section class="auth-card" aria-label="Sign in form">
      <div class="brand">
        <div class="logo-badge">A</div>
        <p class="system-name">Alumni Management System</p>
      </div>

      <div class="heading">
        <h1>Welcome back</h1>
        <p>Sign in to continue</p>
      </div>

      <form id="loginForm" novalidate>
        <label>
          Email Address
          <input id="emailInput" type="email" autocomplete="email" autofocus required />
        </label>
        <label>
          Password
          <span class="password-wrap">
            <input id="passwordInput" type="password" autocomplete="current-password" required />
            <button id="togglePassword" class="toggle-password" type="button" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </span>
        </label>
        <div id="errorMessage" class="error-message">Invalid email or password. Please try again.</div>
        <button id="submitBtn" class="submit-btn" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitText">Sign In</span>
        </button>
      </form>

      <p class="bottom-text">Need access? Contact your administrator</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Always sign out any existing session when landing on login page
      // This ensures user must sign in every time, session is never reused
      await supabaseClient.auth.signOut();

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const togglePassword = document.getElementById('togglePassword');
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const errorMessage = document.getElementById('errorMessage');

      togglePassword.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorMessage.classList.remove('is-visible');
        submitBtn.disabled = true;
        submitBtn.classList.add('is-loading');
        submitText.textContent = 'Signing In';

        const { error } = await supabaseClient.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });

        if (error) {
          errorMessage.textContent = 'Invalid email or password. Please try again.';
          errorMessage.classList.add('is-visible');
          submitBtn.disabled = false;
          submitBtn.classList.remove('is-loading');
          submitText.textContent = 'Sign In';
          return;
        }

        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
